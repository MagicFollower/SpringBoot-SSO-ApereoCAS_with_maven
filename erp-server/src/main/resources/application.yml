server:
  port: 8081
  servlet:
    context-path: /erp
    session:
      timeout: 30m
      cookie:
        name: ERPSESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: erp-server
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: "${ERP_DB_URL:jdbc:mysql://localhost:3306/cas_sso?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}"
      username: "${ERP_DB_USER:root}"
      password: "${ERP_DB_PASSWORD:Mysql12345}"
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 5000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      time-between-eviction-runs-millis: 60000
      filters: stat,wall
      stat-view-servlet:
        enabled: false

erp:
  channel-code: ERP
  service-base-url: "${ERP_SERVICE_BASE_URL:http://localhost:8081/erp}"
  frontend-base-url: "${ERP_FRONTEND_BASE_URL:http://localhost:5173}"
  cas:
    base-url: "${CAS_BASE_URL:http://localhost:8080/cas}"
    validate-path: /p3/serviceValidate
    http-timeout-seconds: 5

logging:
  level:
    com.example.erp: INFO